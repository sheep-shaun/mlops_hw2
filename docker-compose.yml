name: mlops-clickhouse

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9096:9096"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    networks: [hw2]

  kafka-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in transactions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    networks: [hw2]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./sql/01_tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --query 'EXISTS TABLE fraud.transactions_mv' | grep -qx 1",
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24
    restart: unless-stopped
    networks: [hw2]

  loader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTIONS_TOPIC: transactions
    volumes:
      - ./data:/data:ro
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    profiles: [tools]
    networks: [hw2]

  export:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "hw2.export_result"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    volumes:
      - ./data:/data:ro
      - ./results:/results
    depends_on:
      clickhouse:
        condition: service_healthy
    profiles: [tools]
    networks: [hw2]

networks:
  hw2:
    driver: bridge

volumes:
  kafka-data:
  clickhouse-data:
